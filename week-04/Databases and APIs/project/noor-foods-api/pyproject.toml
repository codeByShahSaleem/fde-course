[project]
name = "noor-foods-api"
version = "0.1.0"
description = "An API for Noor Foods products, orders and stock"
readme = "README.md"
authors = [
    { name = "Shah Saleem", email = "rajubhye632@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic",
]



[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "noor_foods_api.main:app"

